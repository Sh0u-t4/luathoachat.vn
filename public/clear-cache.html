<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear Cache - Luật Hóa Chất</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    .status {
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 16px;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    button {
      background: #0891b2;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
    }
    button:hover {
      background: #0e7490;
    }
    button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>🧹 Xóa Cache & Service Worker</h1>
  <p>Nếu bạn gặp lỗi "SyntaxError: Invalid or unexpected token", hãy sử dụng công cụ này để xóa cache.</p>

  <div id="status" class="status info">
    Sẵn sàng để xóa cache...
  </div>

  <button id="clearBtn" onclick="clearAll()">Xóa Cache & Reload</button>
  <button onclick="window.location.href='/'">Về Trang Chủ</button>

  <script>
    async function clearAll() {
      const statusEl = document.getElementById('status');
      const btnEl = document.getElementById('clearBtn');

      btnEl.disabled = true;
      statusEl.className = 'status info';
      statusEl.textContent = 'Đang xóa cache...';

      try {
        // 1. Clear all caches
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(
            cacheNames.map(cacheName => {
              console.log('Deleting cache:', cacheName);
              return caches.delete(cacheName);
            })
          );
          console.log('✅ All caches cleared');
        }

        // 2. Unregister all service workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(
            registrations.map(registration => {
              console.log('Unregistering service worker:', registration);
              return registration.unregister();
            })
          );
          console.log('✅ All service workers unregistered');
        }

        // 3. Clear localStorage & sessionStorage
        localStorage.clear();
        sessionStorage.clear();
        console.log('✅ Local storage cleared');

        statusEl.className = 'status success';
        statusEl.innerHTML = `
          <strong>✅ Xóa cache thành công!</strong><br>
          Trang sẽ tự động reload sau 2 giây...
        `;

        // Reload after 2 seconds
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);

      } catch (error) {
        console.error('Error clearing cache:', error);
        statusEl.className = 'status error';
        statusEl.innerHTML = `
          <strong>❌ Lỗi khi xóa cache</strong><br>
          ${error.message}<br><br>
          Vui lòng thử Hard Refresh: <strong>Ctrl+Shift+R</strong> (Windows) hoặc <strong>Cmd+Shift+R</strong> (Mac)
        `;
        btnEl.disabled = false;
      }
    }

    // Show current cache status on load
    window.addEventListener('load', async () => {
      const statusEl = document.getElementById('status');
      let info = [];

      if ('caches' in window) {
        const cacheNames = await caches.keys();
        info.push(`📦 ${cacheNames.length} cache(s) tìm thấy`);
      }

      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        info.push(`⚙️ ${registrations.length} service worker(s) đang chạy`);
      }

      if (info.length > 0) {
        statusEl.innerHTML = info.join('<br>');
      }
    });
  </script>
</body>
</html>
